<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>CRM Bienes Raíces · Costa Rica</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  /* default warm terracotta */
  --accent: #B85C38;
  --accent-soft: #F4E2D6;
  --accent-deep: #8A3F22;
  --accent-ink: #FFFFFF;

  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --surface-2: #F4EFE7;
  --surface-3: #EBE4D7;
  --ink: #221C16;
  --ink-2: #4A3F35;
  --muted: #837868;
  --muted-soft: #B0A595;
  --border: #E5DDCD;
  --border-strong: #D2C7B3;

  --whatsapp: #25D366;
  --whatsapp-deep: #128C7E;

  --ok: #16A34A;
  --warn: #D97706;
  --danger: #DC2626;

  --font-sans: 'Geist', system-ui, sans-serif;
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 18px;

  --pad-1: 4px;
  --pad-2: 8px;
  --pad-3: 12px;
  --pad-4: 16px;
  --pad-5: 24px;
  --pad-6: 32px;

  --row-h: 64px; /* density-driven */
  --base-fs: 14px;

  --shadow-1: 0 1px 2px rgba(34, 28, 22, 0.04), 0 1px 0 rgba(34, 28, 22, 0.02);
  --shadow-2: 0 2px 8px rgba(34, 28, 22, 0.06), 0 1px 2px rgba(34, 28, 22, 0.04);
  --shadow-3: 0 12px 32px rgba(34, 28, 22, 0.10), 0 4px 8px rgba(34, 28, 22, 0.06);
}

/* density variants */
body[data-density="compact"] {
  --pad-3: 8px; --pad-4: 12px; --pad-5: 16px; --pad-6: 22px;
  --row-h: 52px; --base-fs: 13px;
}
body[data-density="comfortable"] {
  --pad-3: 14px; --pad-4: 18px; --pad-5: 28px; --pad-6: 38px;
  --row-h: 76px; --base-fs: 15px;
}

/* font variants */
body[data-font="manrope"] { --font-sans: 'Manrope', system-ui, sans-serif; }
body[data-font="jakarta"] { --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif; }

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--base-fs);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

/* Unified form input system */
.p-inp, .onb-inp, .inp, .m-inp {
  width: 100%;
  padding: 10px 13px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  outline: 0;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  line-height: 1.4;
  box-shadow: 0 1px 0 rgba(34, 28, 22, 0.02);
}
.p-inp::placeholder, .onb-inp::placeholder, .inp::placeholder, .m-inp::placeholder {
  color: var(--muted-soft);
}
.p-inp:hover:not(:focus):not(:disabled),
.onb-inp:hover:not(:focus):not(:disabled),
.inp:hover:not(:focus):not(:disabled),
.m-inp:hover:not(:focus):not(:disabled) {
  border-color: #C4B5A0;
}
.p-inp:focus, .onb-inp:focus, .inp:focus, .m-inp:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.p-inp:disabled, .onb-inp:disabled, .inp:disabled, .m-inp:disabled {
  background: var(--surface-2);
  color: var(--muted);
  cursor: not-allowed;
}
select.p-inp, select.onb-inp, select.inp, select.m-inp {
  cursor: pointer;
  padding-right: 36px;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%23837868' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 13px center;
}
textarea.p-inp, textarea.onb-inp, textarea.inp, textarea.m-inp {
  resize: vertical;
  line-height: 1.55;
  min-height: 80px;
}
input[type="date"].p-inp, input[type="date"].inp, input[type="date"].m-inp,
input[type="datetime-local"].p-inp, input[type="datetime-local"].inp, input[type="datetime-local"].m-inp,
input[type="time"].p-inp, input[type="time"].inp, input[type="time"].m-inp {
  font-variant-numeric: tabular-nums;
}
/* Compact variant for smaller forms */
.m-inp { padding: 9px 12px; font-size: 13.5px; border-radius: 8px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

#root { min-height: 100vh; }

.app {
  display: grid;
  grid-template-columns: 224px 1fr;
  min-height: 100vh;
  background: var(--bg);
}

/* ---- Sidebar ---- */
.sb {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sb-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 8px 18px;
}
.sb-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid; place-items: center;
  font-weight: 700;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 22px;
  line-height: 1;
}
.sb-brand-text { line-height: 1.1; }
.sb-brand-name { font-weight: 700; font-size: 15px; }
.sb-brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }

.sb-section { margin-top: 6px; }
.sb-section-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); padding: 12px 12px 6px; font-weight: 600;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  color: var(--ink-2); font-size: 13.5px;
  width: 100%; text-align: left;
  font-weight: 500;
  position: relative;
}
.sb-item:hover { background: var(--surface-2); color: var(--ink); }
.sb-item.active {
  background: var(--accent-soft);
  color: var(--accent-deep);
  font-weight: 600;
}
.sb-item .ico { width: 18px; height: 18px; display: grid; place-items: center; flex-shrink: 0; opacity: 0.85; }
.sb-item.active .ico { opacity: 1; }
.sb-badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 600;
  min-width: 18px;
  text-align: center;
}
.sb-spacer { flex: 1; }
.sb-user {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 8px;
  border-top: 1px solid var(--border);
  margin-top: 12px;
}
.sb-user-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 600;
}
.sb-user-info { flex: 1; line-height: 1.1; min-width: 0; }
.sb-user-name { font-size: 13px; font-weight: 600; }
.sb-user-role { font-size: 11px; color: var(--muted); }

/* ---- Main pane ---- */
.main {
  min-width: 0;
  display: flex; flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px var(--pad-5);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  height: 60px;
}
.topbar-title {
  display: flex; align-items: baseline; gap: 10px;
}
.topbar-title h1 {
  margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
}
.topbar-title .sub { color: var(--muted); font-size: 13px; }
.topbar-spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  width: 280px;
  color: var(--muted);
}
.search input { background: transparent; border: 0; outline: 0; width: 100%; font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  background: var(--ink);
  color: var(--surface);
  transition: opacity 0.15s ease, transform 0.05s ease;
}
.btn:hover { opacity: 0.92; }
.btn:active { transform: scale(0.98); }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12px; }

.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: grid; place-items: center;
  color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* content area */
.content {
  flex: 1;
  overflow: auto;
  min-height: 0;
}

/* generic surface card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
}

/* status pill */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.tag {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 500;
}

/* shared section header */
.page {
  padding: var(--pad-5);
}
.page-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: var(--pad-5);
  gap: 16px;
}
.page-header h2 {
  margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em;
}
.page-header .sub { color: var(--muted); font-size: 14px; }

.tabbar {
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--border);
  padding: 0 var(--pad-5);
  background: var(--surface);
}
.tab {
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab.active {
  color: var(--accent-deep);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tab:hover:not(.active) { color: var(--ink-2); }

/* utility */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; }
.mono { font-family: var(--font-mono); }
.serif { font-family: var(--font-display); }

.kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  padding: 1px 5px;
  border-radius: 4px;
  color: var(--muted);
}
</style>
</head>
